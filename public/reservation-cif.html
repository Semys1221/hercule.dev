<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection · Conférence Hercule</title>
    <meta http-equiv="refresh" content="0;url=/reservation-conference.html">
    <script>
        (function () {
            var target = '/reservation-conference.html';
            var params = new URLSearchParams(window.location.search);
            var pathMatch = window.location.pathname.match(/\/reservation-cif\.html\/([^/]+)\/?$/);
            var slug = params.get('code') || params.get('utm_content') || (pathMatch ? pathMatch[1] : '');
            if (slug) {
                target += '/' + encodeURIComponent(slug);
            } else if (params.toString()) {
                target += '?' + params.toString();
            }
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirection vers la <a href="/reservation-conference.html">conférence Hercule</a>…</p>
</body>
</html>
