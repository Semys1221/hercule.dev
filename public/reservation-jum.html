<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un créneau · JUM Advisory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
    <style>
        :root {
            --background: #f4f5f7;
            --foreground: #14181f;
            --muted: #5c6570;
            --accent: #1a1f28;
            --border: rgba(20, 24, 31, 0.08);
            --card: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.45);
            --glass-shadow: 0 20px 60px rgba(20, 30, 50, 0.08);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', 'DM Sans', ui-sans-serif, system-ui, sans-serif;
            --font-display: 'Inter', ui-sans-serif, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-sans);
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(180, 195, 215, 0.28), transparent 60%),
                linear-gradient(180deg, var(--background) 0%, #eceef2 100%);
            color: var(--foreground);
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            text-align: center;
        }

        .brand-mark {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--foreground);
            line-height: 1;
        }

        .hero {
            margin-bottom: 28px;
            text-align: center;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: clamp(28px, 4.5vw, 40px);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin: 0 0 12px;
            line-height: 1.2;
            color: var(--foreground);
        }

        .hero h2.next-slot {
            margin: 0;
            color: var(--muted);
            font-family: var(--font-display);
            font-size: clamp(15px, 2vw, 18px);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.45;
        }

        .badge {
            display: inline-block;
            margin-bottom: 14px;
            padding: 6px 14px;
            border-radius: 999px;
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--foreground);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            min-height: 620px;
            box-shadow: var(--glass-shadow);
        }

        .calendly-wrapper { position: relative; min-height: 620px; }

        .calendly-loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.85);
            z-index: 2;
        }

        .calendly-loader.is-hidden { display: none; }

        .loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(20, 24, 31, 0.12);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text { color: var(--muted); font-size: 14px; }

        #calendly-embed { min-height: 620px; }

        .confirmation {
            display: none;
            padding: 0;
            text-align: left;
            min-height: 480px;
        }

        .confirmation.is-visible { display: block; }

        .confirmation-layout {
            display: grid;
            grid-template-columns: minmax(220px, 42%) 1fr;
            min-height: 480px;
        }

        .confirmation-media {
            min-height: 100%;
            background: #d8dde5;
        }

        .confirmation-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .confirmation-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 36px;
        }

        .confirmation-content h2 {
            font-family: var(--font-serif);
            font-size: clamp(24px, 3.5vw, 30px);
            font-weight: 600;
            margin: 0 0 12px;
            color: var(--foreground);
            line-height: 1.2;
        }

        .confirmation-content p {
            color: var(--muted);
            margin: 0 0 28px;
            line-height: 1.6;
            font-size: 15px;
            max-width: 36ch;
        }

        .cta {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 999px;
            background: #ffffff;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(20, 30, 50, 0.08);
            transition: background 0.15s ease, box-shadow 0.15s ease;
            align-self: flex-start;
        }

        .cta:hover {
            background: #f4f5f7;
            box-shadow: 0 6px 20px rgba(20, 30, 50, 0.12);
        }

        .booking-hidden { display: none !important; }

        @media (max-width: 640px) {
            .confirmation-layout {
                grid-template-columns: 1fr;
            }

            .confirmation-media {
                height: 240px;
                min-height: 240px;
            }

            .confirmation-content {
                padding: 28px 24px 36px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="brand">
            <div class="brand-mark">JUM</div>
        </header>

        <div class="hero" id="hero">
            <h1>Réserver votre échange</h1>
            <h2 id="next-slot" class="next-slot">Prochaine disponibilité le …</h2>
        </div>

        <div class="card">
            <div id="view-booking" class="calendly-wrapper">
                <div class="calendly-loader" id="calendly-loader" aria-live="polite">
                    <div class="loader-spinner" aria-hidden="true"></div>
                    <p class="loader-text">Chargement du calendrier…</p>
                </div>
                <div id="calendly-embed"></div>
            </div>

            <div id="view-confirmation" class="confirmation">
                <div class="confirmation-layout">
                    <div class="confirmation-media">
                        <img
                            src="https://grzs6rqzvzupoxv9.public.blob.vercel-storage.com/jum-portrait.webp"
                            alt="Équipe JUM Advisory"
                            loading="lazy"
                            decoding="async"
                        />
                    </div>
                    <div class="confirmation-content">
                        <span class="badge">Rendez-vous confirmé</span>
                        <h2>Votre rendez-vous est confirmé</h2>
                        <p>Vous recevrez une confirmation par email avec le lien de connexion Calendly. Merci de votre confiance.</p>
                        <a class="cta" href="https://jum-advisory.com" target="_blank" rel="noopener noreferrer">Découvrir JUM Advisory</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <script>
        var CALENDLY_BY_SEGMENT = {
            restaurant: 'https://calendly.com/jum-advisory/rendez-vous-comptable-restaurant',
            b2b: 'https://calendly.com/jum-advisory/rendez-vous-comptable-btp',
            btp: 'https://calendly.com/jum-advisory/rendez-vous-comptable-btp',
            terrassement: 'https://calendly.com/jum-advisory/rendez-vous-comptable-btp',
            dentiste: 'https://calendly.com/jum-advisory/rendez-vous-comptable-dentiste'
        };
        var CALENDLY_BY_CAMPAIGN = {
            'e4f11e76-717e-4be9-a6ad-c7f0a331afb7': CALENDLY_BY_SEGMENT.restaurant,
            '05bc06f8-4f60-4e6c-bae1-7afe30df38c7': CALENDLY_BY_SEGMENT.b2b,
            '0f0b450a-e550-461c-96f6-1a7681678d67': CALENDLY_BY_SEGMENT.dentiste
        };
        var DEFAULT_CALENDLY_URL = CALENDLY_BY_SEGMENT.restaurant;
        var calendlyEventUrl = DEFAULT_CALENDLY_URL;
        var loaderHidden = false;

        var params = new URLSearchParams(window.location.search);
        var pathMatch = window.location.pathname.match(/\/reservation-jum\.html\/([^/]+)\/?$/);
        var shortCode = params.get('code') || params.get('utm_content') || (pathMatch ? pathMatch[1] : '') || '';
        var prospectEmail = params.get('email') || '';
        var segmentHint = (params.get('segment') || params.get('niche') || '').trim().toLowerCase();

        function hideLoader() {
            if (loaderHidden) return;
            loaderHidden = true;
            document.getElementById('calendly-loader').classList.add('is-hidden');
        }

        function resolveCalendlyUrl(segment, campaignId) {
            if (segment && CALENDLY_BY_SEGMENT[segment]) {
                return CALENDLY_BY_SEGMENT[segment];
            }
            if (campaignId && CALENDLY_BY_CAMPAIGN[campaignId]) {
                return CALENDLY_BY_CAMPAIGN[campaignId];
            }
            return DEFAULT_CALENDLY_URL;
        }

        function buildCalendlyUrl(base) {
            var url = new URL(base);
            if (prospectEmail) url.searchParams.set('email', prospectEmail);
            if (shortCode) url.searchParams.set('utm_content', shortCode);
            return url.toString();
        }

        function isCalendlyEvent(event) {
            return event.origin === 'https://calendly.com'
                && event.data
                && typeof event.data.event === 'string'
                && event.data.event.indexOf('calendly.') === 0;
        }

        function showConfirmation() {
            document.getElementById('view-booking').classList.add('booking-hidden');
            document.getElementById('hero').classList.add('booking-hidden');
            document.getElementById('view-confirmation').classList.add('is-visible');
            document.title = 'Rendez-vous confirmé · JUM Advisory';
        }

        function formatNextSlotLabel(iso) {
            var date = new Date(iso);
            if (Number.isNaN(date.getTime())) return '';
            var dayMonth = new Intl.DateTimeFormat('fr-FR', {
                timeZone: 'Europe/Paris',
                day: 'numeric',
                month: 'long'
            }).format(date);
            var parts = new Intl.DateTimeFormat('fr-FR', {
                timeZone: 'Europe/Paris',
                hour: 'numeric',
                minute: '2-digit',
                hour12: false
            }).formatToParts(date);
            var hour = (parts.find(function(part) { return part.type === 'hour'; }) || {}).value || '0';
            var minute = (parts.find(function(part) { return part.type === 'minute'; }) || {}).value || '00';
            var timeLabel = minute === '00' ? hour + 'h' : hour + 'h' + minute;
            return 'Prochaine disponibilité le ' + dayMonth + ' à ' + timeLabel;
        }

        async function fetchNextSlot() {
            var el = document.getElementById('next-slot');
            if (!el) return;
            try {
                var response = await fetch('/api/calendly/next-slots?event=jum&count=1');
                var data = await response.json();
                if (!response.ok || !data.ok || !data.slots || !data.slots[0] || !data.slots[0].iso) {
                    return;
                }
                var label = formatNextSlotLabel(data.slots[0].iso);
                if (!label) return;
                el.textContent = label;
            } catch (err) { /* non-blocking — keep placeholder H2 */ }
        }

        async function trackClick() {
            if (segmentHint && CALENDLY_BY_SEGMENT[segmentHint]) {
                calendlyEventUrl = CALENDLY_BY_SEGMENT[segmentHint];
            }
            if (!shortCode) return;
            try {
                var response = await fetch('/api/link-tracking/click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug: shortCode })
                });
                if (!response.ok) return;
                var data = await response.json();
                calendlyEventUrl = resolveCalendlyUrl(data.segment, data.campaignId);
            } catch (err) { /* non-blocking */ }
        }

        function initCalendly() {
            if (!window.Calendly) {
                setTimeout(initCalendly, 120);
                return;
            }
            window.Calendly.initInlineWidget({
                url: buildCalendlyUrl(calendlyEventUrl),
                parentElement: document.getElementById('calendly-embed'),
                prefill: {},
                utm: {}
            });
            hideLoader();
        }

        window.addEventListener('message', function(event) {
            if (!isCalendlyEvent(event)) return;
            if (event.data.event === 'calendly.event_scheduled') showConfirmation();
            if (event.data.event === 'calendly.page_height') hideLoader();
        });

        async function boot() {
            await trackClick();
            void fetchNextSlot();
            initCalendly();
        }

        void boot();
    </script>
</body>
</html>
