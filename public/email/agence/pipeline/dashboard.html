<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Hercule — Accès agence</title>
  <link rel="icon" href="/icon-32x32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
  <style>
    :root {
      --bg: #09090B;
      --fg: #ffffff;
      --muted: #a1a1aa;
      --accent: #6366f1;
      --border: #27272a;
      --card: #111113;
      --font: 'Geist', ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 40px 32px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: radial-gradient(ellipse at top, rgba(99,102,241,0.12), transparent 55%), var(--card);
      text-align: center;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 0 0 12px;
      font-weight: 600;
    }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Hercule Libéral</p>
    <h1>Candidature via votre conseiller Hercule</h1>
    <p>
      L'accès au pipeline se fait désormais avec votre conseiller pendant la session commerciale.
      Contactez votre interlocuteur Hercule pour poursuivre votre candidature.
    </p>
  </main>
</body>
</html>
