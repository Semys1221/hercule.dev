<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection · Hercule</title>
    <script>
        (function () {
            var match = window.location.pathname.match(/\/dashboard\.html\/([^/]+)\/?$/);
            if (match) {
                window.location.replace("/dashboard/" + decodeURIComponent(match[1]) + window.location.search);
            } else {
                window.location.replace("/");
            }
        })();
    </script>
</head>
<body></body>
</html>
