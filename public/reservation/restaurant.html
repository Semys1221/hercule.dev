<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection · JUM Advisory</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-family: ui-sans-serif, system-ui, sans-serif;
            color: #18181b;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e4e4e7;
            border-top-color: #18181b;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner" aria-hidden="true"></div>
    <script>
        (function () {
            var CALENDLY = 'https://calendly.com/jum-advisory/rentabilite-restaurant';
            var DELAY_MS = 500;

            function redirect() {
                window.location.replace(CALENDLY);
            }

            setTimeout(function () {
                fetch('/api/restaurant-e1/eligibility-click', { method: 'POST' })
                    .catch(function () {})
                    .finally(redirect);
            }, DELAY_MS);
        })();
    </script>
</body>
</html>
