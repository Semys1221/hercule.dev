<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interested E1 — funnel</title>
    <style>
        :root {
            --bg: #fafafa;
            --fg: #18181b;
            --muted: #71717a;
            --border: #e4e4e7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: ui-sans-serif, system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.5;
        }
        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px 64px;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0 0 8px;
        }
        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 48px 0 8px;
        }
        h2:first-of-type {
            margin-top: 0;
        }
        .meta {
            font-size: 0.875rem;
            color: var(--muted);
            margin: 0 0 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            font-weight: 500;
        }
        tr:last-child td { border-bottom: none; }
        .num { font-variant-numeric: tabular-nums; }
        button {
            margin-top: 16px;
            padding: 8px 14px;
            font-size: 0.875rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }
        button:hover { background: #f4f4f5; }
        .error { color: #b91c1c; font-size: 0.875rem; margin-top: 12px; }
        .section-meta { margin-bottom: 16px; }
        .subheading {
            font-size: 0.875rem;
            font-weight: 600;
            margin: 24px 0 8px;
            color: var(--fg);
        }
    </style>
</head>
<body>
    <main class="page">
        <h1>Interested E1 — funnels</h1>
        <p class="meta">Métriques agrégées publiques (cache ~5 min). Fuseau affiché : heure locale du navigateur.</p>

        <section id="restaurant" aria-labelledby="restaurant-heading">
            <h2 id="restaurant-heading">Restaurant — E1 Interested</h2>
            <p class="meta section-meta" id="restaurant-fetched-at">Chargement…</p>
            <table>
                <thead>
                    <tr>
                        <th>Indicateur</th>
                        <th>Valeur</th>
                    </tr>
                </thead>
                <tbody id="restaurant-metrics-body">
                    <tr><td colspan="2">…</td></tr>
                </tbody>
            </table>
        </section>

        <section id="btp" aria-labelledby="btp-heading">
            <h2 id="btp-heading">BTP — E1 Interested</h2>
            <p class="meta section-meta" id="btp-fetched-at">Chargement…</p>
            <table>
                <thead>
                    <tr>
                        <th>Indicateur</th>
                        <th>Valeur</th>
                    </tr>
                </thead>
                <tbody id="btp-metrics-body">
                    <tr><td colspan="2">…</td></tr>
                </tbody>
            </table>
            <p class="subheading">Derniers clics (btp.html)</p>
            <table>
                <thead>
                    <tr>
                        <th>Horodatage</th>
                    </tr>
                </thead>
                <tbody id="btp-recent-clicks">
                    <tr><td>…</td></tr>
                </tbody>
            </table>
        </section>

        <button type="button" id="refresh">Rafraîchir</button>
        <p class="error" id="error" hidden></p>
    </main>
    <script>
        function formatRate(rate) {
            if (rate === null || rate === undefined || Number.isNaN(rate)) {
                return '—';
            }
            return (rate * 100).toFixed(1) + ' %';
        }

        function formatDateTime(iso) {
            if (!iso) return '—';
            try {
                return new Date(iso).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'medium' });
            } catch (e) {
                return iso;
            }
        }

        function renderFunnelMetrics(data, bodyId, fetchedAtId) {
            var rows = [
                ['Emails E1 envoyés', data.emailsE1Sent],
                ['Clics page RDV', data.clicks],
                ['Bookings Calendly', data.bookings],
                ['Taux clic / email', formatRate(data.clickRateFromEmails)],
                ['Taux booking / clic', formatRate(data.bookingRateFromClicks)],
                ['Taux booking / email', formatRate(data.bookingRateFromEmails)]
            ];
            var html = rows.map(function (row) {
                var cls = typeof row[1] === 'number' ? ' class="num"' : '';
                return '<tr><td>' + row[0] + '</td><td' + cls + '>' + row[1] + '</td></tr>';
            }).join('');
            document.getElementById(bodyId).innerHTML = html;
            var at = data.fetchedAt ? formatDateTime(data.fetchedAt) : '—';
            document.getElementById(fetchedAtId).textContent = 'Dernière mise à jour : ' + at;
        }

        function renderBtpRecentClicks(recentClicks) {
            var list = recentClicks || [];
            if (!list.length) {
                document.getElementById('btp-recent-clicks').innerHTML =
                    '<tr><td>Aucun clic enregistré</td></tr>';
                return;
            }
            var html = list.map(function (row) {
                return '<tr><td class="num">' + formatDateTime(row.clickedAt) + '</td></tr>';
            }).join('');
            document.getElementById('btp-recent-clicks').innerHTML = html;
        }

        function fetchJson(url) {
            return fetch(url)
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
                .then(function (res) {
                    if (!res.ok || res.j.error) {
                        throw new Error(res.j.error || 'Erreur serveur');
                    }
                    return res.j;
                });
        }

        function load(refresh) {
            var errEl = document.getElementById('error');
            errEl.hidden = true;
            var q = refresh ? '?refresh=1' : '';
            Promise.all([
                fetchJson('/api/restaurant-e1/metrics' + q),
                fetchJson('/api/btp-e1/metrics' + q)
            ])
                .then(function (results) {
                    renderFunnelMetrics(results[0], 'restaurant-metrics-body', 'restaurant-fetched-at');
                    renderFunnelMetrics(results[1], 'btp-metrics-body', 'btp-fetched-at');
                    renderBtpRecentClicks(results[1].recentClicks);
                })
                .catch(function (e) {
                    errEl.textContent = e.message || 'Impossible de charger les métriques.';
                    errEl.hidden = false;
                });
        }

        document.getElementById('refresh').addEventListener('click', function () { load(true); });
        load(false);

        if (window.location.hash === '#btp') {
            document.getElementById('btp').scrollIntoView();
        }
    </script>
</body>
</html>
