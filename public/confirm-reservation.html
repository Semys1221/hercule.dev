<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de rendez-vous · Hercule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
    <style>
        :root {
            --background: #09090B;
            --foreground: #ffffff;
            --muted-foreground: #a1a1aa;
            --border: #27272a;
            --success: #22c55e;
            --error: #ef4444;
            --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 64px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .brand svg {
            width: 20px;
            height: 20px;
        }

        .brand span {
            font-size: 15px;
            font-weight: 600;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            margin: 0 0 12px;
            letter-spacing: -0.02em;
        }

        .intro {
            margin: 0 0 8px;
            color: var(--muted-foreground);
            font-size: 15px;
        }

        .status {
            margin-top: 8px;
            font-size: 15px;
        }

        .status.ok { color: var(--success); }
        .status.error { color: var(--error); }
        .status.pending { color: var(--muted-foreground); }
    </style>
</head>
<body>
    <div class="page">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hercule">
                <path d="M3 5v14l7.5-7L3 5z" fill="#ffffff"/>
                <path d="M21 5v14l-7.5-7L21 5z" fill="#a1a1aa"/>
            </svg>
            <span>Hercule</span>
        </div>

        <h1>Votre rendez-vous avec Hercule</h1>
        <p class="intro" id="intro">Confirmation de votre créneau.</p>
        <p id="status" class="status pending" aria-live="polite">Confirmation en cours…</p>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var pathMatch = window.location.pathname.match(/\/confirm-reservation\.html\/([^/]+)\/?$/);
        var slug = params.get('code') || params.get('slug') || (pathMatch ? pathMatch[1] : '') || '';
        var email = params.get('email') || '';
        var statusEl = document.getElementById('status');
        var introEl = document.getElementById('intro');

        async function confirmPresence() {
            if (!slug && !email) {
                introEl.textContent = '';
                statusEl.textContent = 'Lien invalide : identifiant manquant. Ouvrez ce lien depuis l\'email de confirmation.';
                statusEl.className = 'status error';
                return;
            }

            statusEl.textContent = 'Confirmation en cours…';
            statusEl.className = 'status pending';

            try {
                var res = await fetch('/api/link-tracking/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug: slug, email: email })
                });
                var data = await res.json();
                if (!res.ok || data.ok === false) {
                    throw new Error(data.error || data.reason || 'Échec');
                }
                introEl.textContent = '';
                statusEl.textContent = data.alreadyConfirmed
                    ? 'Votre présence était déjà confirmée. Merci.'
                    : 'Votre créneau a bien été confirmé. Merci.';
                statusEl.className = 'status ok';
            } catch (err) {
                introEl.textContent = '';
                statusEl.textContent = err instanceof Error ? err.message : 'Impossible de confirmer.';
                statusEl.className = 'status error';
            }
        }

        void confirmPresence();
    </script>
</body>
</html>
