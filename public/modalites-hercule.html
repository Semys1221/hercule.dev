<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modalités d'Hercule · Confirmation</title>
    <link rel="icon" href="/icon-32x32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
    <style>
        :root {
            --background: #09090B;
            --foreground: #ffffff;
            --muted-foreground: #a1a1aa;
            --border: #27272a;
            --accent: #ffffff;
            --success: #22c55e;
            --error: #ef4444;
            --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 64px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .brand svg { width: 20px; height: 20px; }
        .brand span { font-size: 15px; font-weight: 600; }

        h1 {
            font-size: 28px;
            font-weight: 500;
            margin: 0 0 12px;
            letter-spacing: -0.02em;
        }

        .intro, .meeting, .formula-detail, .success-message, .meeting-recap {
            color: var(--muted-foreground);
            font-size: 15px;
            margin: 0 0 16px;
        }

        .meeting { color: var(--foreground); font-weight: 500; }

        .formulas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0 32px;
        }

        .formula {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
        }

        .formula-name {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px;
        }

        .formula-detail { margin: 0; }

        .status { margin-top: 12px; font-size: 15px; }
        .status.ok { color: var(--success); }
        .status.error { color: var(--error); }
        .status.pending { color: var(--muted-foreground); }

        .faq { border-top: 1px solid var(--border); padding-top: 24px; margin-top: 32px; }
        .section-title {
            margin: 0 0 16px;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted-foreground);
        }
        .accordion { margin: 0; padding: 0; list-style: none; }
        .accordion-item { border-bottom: 1px solid var(--border); }
        .accordion-trigger {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 16px 0;
            background: none;
            border: 0;
            color: var(--foreground);
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            line-height: 1.45;
            cursor: pointer;
        }
        .accordion-chevron {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            color: var(--muted-foreground);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        .accordion-item.is-open .accordion-chevron { transform: rotate(180deg); }
        .accordion-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
        .accordion-item.is-open .accordion-panel { grid-template-rows: 1fr; }
        .accordion-panel-inner { overflow: hidden; }
        .accordion-panel-inner p {
            color: var(--muted-foreground);
            font-size: 14px;
            line-height: 1.65;
            margin: 0 0 12px;
            text-align: left;
        }
        .accordion-panel-inner p:last-child { margin-bottom: 16px; }
        .accordion-panel-inner a {
            color: var(--foreground);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .accordion-panel-inner a:hover { color: var(--accent); }

        .is-hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="page">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hercule">
                <path d="M3 5v14l7.5-7L3 5z" fill="#ffffff"/>
                <path d="M21 5v14l-7.5-7L21 5z" fill="#a1a1aa"/>
            </svg>
            <span>Hercule</span>
        </div>

        <div id="previewView">
            <h1>Modalités d'Hercule</h1>
            <p class="intro" id="intro">Chargement de votre rendez-vous…</p>
            <p class="meeting is-hidden" id="meeting"></p>
            <div class="formulas is-hidden" id="formulas"></div>
            <p id="status" class="status pending" aria-live="polite"></p>
        </div>

        <div id="successView" class="is-hidden">
            <h1>Validation enregistrée</h1>
            <p class="success-message" id="successMessage"></p>
            <p class="meeting-recap is-hidden" id="meetingRecap"></p>
            <div class="faq">
                <p class="section-title">FAQ</p>
                <ul class="accordion" id="faq"></ul>
            </div>
        </div>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var pathMatch = window.location.pathname.match(/\/modalites-hercule\.html\/([^/]+)\/?$/);
        var slug = params.get('code') || params.get('slug') || (pathMatch ? pathMatch[1] : '') || '';
        var email = params.get('email') || '';
        var alreadyConfirmed = params.get('confirmed') === '1';
        var autoConfirm = params.get('confirm') === '1';

        var previewViewEl = document.getElementById('previewView');
        var successViewEl = document.getElementById('successView');
        var introEl = document.getElementById('intro');
        var meetingEl = document.getElementById('meeting');
        var formulasEl = document.getElementById('formulas');
        var statusEl = document.getElementById('status');
        var successMessageEl = document.getElementById('successMessage');
        var meetingRecapEl = document.getElementById('meetingRecap');
        var faqEl = document.getElementById('faq');

        var lastContext = null;

        function initAccordionGroup(container, itemSelector) {
            if (!container) return;
            var items = container.querySelectorAll(itemSelector);
            items.forEach(function(item) {
                var trigger = item.querySelector('[data-accordion-trigger]');
                if (!trigger) return;
                trigger.addEventListener('click', function() {
                    var isOpen = item.classList.contains('is-open');
                    items.forEach(function(other) {
                        other.classList.remove('is-open');
                        var otherTrigger = other.querySelector('[data-accordion-trigger]');
                        if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
                    });
                    if (!isOpen) {
                        item.classList.add('is-open');
                        trigger.setAttribute('aria-expanded', 'true');
                    }
                });
            });
        }

        function renderFaq(entries) {
            faqEl.innerHTML = '';
            (entries || []).forEach(function(entry) {
                var item = document.createElement('li');
                item.className = 'accordion-item';

                var trigger = document.createElement('button');
                trigger.className = 'accordion-trigger';
                trigger.type = 'button';
                trigger.setAttribute('data-accordion-trigger', '');
                trigger.setAttribute('aria-expanded', 'false');

                var question = document.createElement('span');
                question.textContent = entry.question;
                trigger.appendChild(question);

                var chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                chevron.setAttribute('class', 'accordion-chevron');
                chevron.setAttribute('viewBox', '0 0 24 24');
                chevron.setAttribute('fill', 'none');
                chevron.setAttribute('stroke', 'currentColor');
                chevron.setAttribute('stroke-width', '2');
                chevron.setAttribute('aria-hidden', 'true');
                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', 'M6 9l6 6 6-6');
                chevron.appendChild(path);
                trigger.appendChild(chevron);

                var panel = document.createElement('div');
                panel.className = 'accordion-panel';

                var panelInner = document.createElement('div');
                panelInner.className = 'accordion-panel-inner';

                var answer = document.createElement('p');
                answer.textContent = entry.answer;
                panelInner.appendChild(answer);

                if (entry.cvgLink) {
                    var cvg = document.createElement('p');
                    var link = document.createElement('a');
                    link.href = '/cvg';
                    link.textContent = 'Voir les CGV';
                    cvg.appendChild(link);
                    panelInner.appendChild(cvg);
                }

                panel.appendChild(panelInner);
                item.appendChild(trigger);
                item.appendChild(panel);
                faqEl.appendChild(item);
            });
            initAccordionGroup(faqEl, '.accordion-item');
        }

        function showConfirmedPage(context, already) {
            previewViewEl.classList.add('is-hidden');
            successViewEl.classList.remove('is-hidden');

            successMessageEl.textContent = already
                ? 'Votre validation était déjà prise en compte.'
                : 'Votre validation est prise en compte.';

            if (context && context.date && context.heure) {
                meetingRecapEl.textContent =
                    'Votre rendez-vous est prévu le ' + context.date + ' à ' + context.heure + ' (heure de Paris).';
                meetingRecapEl.classList.remove('is-hidden');
            } else {
                meetingRecapEl.classList.add('is-hidden');
            }

            renderFaq(context && context.faq ? context.faq : []);
        }

        function formatConfirmError(reason) {
            if (reason === 'not_booked_yet') {
                return 'Votre rendez-vous n\'est pas encore enregistré. Réessayez dans quelques minutes ou contactez-nous.';
            }
            if (reason === 'lead_cancelled') {
                return 'Ce rendez-vous a déjà été annulé.';
            }
            if (reason === 'lead_not_found') {
                return 'Lien introuvable. Ouvrez ce lien depuis l\'email reçu.';
            }
            return reason || 'Impossible de confirmer.';
        }

        function showError(message) {
            previewViewEl.classList.remove('is-hidden');
            successViewEl.classList.add('is-hidden');
            introEl.textContent = '';
            meetingEl.classList.add('is-hidden');
            formulasEl.classList.add('is-hidden');
            statusEl.textContent = formatConfirmError(message);
            statusEl.className = 'status error';
        }

        function markConfirmedInUrl() {
            var next = new URL(window.location.href);
            next.searchParams.set('confirmed', '1');
            next.searchParams.delete('confirm');
            if (slug && !next.searchParams.get('code') && !next.searchParams.get('slug')) {
                next.searchParams.set('code', slug);
            }
            window.history.replaceState({}, '', next.toString());
        }

        function renderContext(data) {
            introEl.textContent = data.intro || '';
            meetingEl.textContent = data.date && data.heure
                ? 'Votre rendez-vous est prévu le ' + data.date + ' à ' + data.heure + ' (heure de Paris).'
                : '';
            meetingEl.classList.remove('is-hidden');
            formulasEl.innerHTML = '';
            (data.formulas || []).forEach(function (formula) {
                var card = document.createElement('div');
                card.className = 'formula';
                var name = document.createElement('p');
                name.className = 'formula-name';
                name.textContent = formula.name + (formula.recommended ? ' — recommandé' : '');
                var detail = document.createElement('p');
                detail.className = 'formula-detail';
                detail.textContent = formula.detail;
                card.appendChild(name);
                card.appendChild(detail);
                formulasEl.appendChild(card);
            });
            formulasEl.classList.remove('is-hidden');
        }

        async function fetchContext() {
            var query = new URLSearchParams();
            if (slug) query.set('slug', slug);
            if (email) query.set('email', email);
            var res = await fetch('/api/modalites-campaign/context?' + query.toString());
            var data = await res.json();
            if (!res.ok || data.ok === false) {
                throw new Error(data.error || data.reason || 'Lien introuvable');
            }
            lastContext = data;
            return data;
        }

        async function submitConfirmation() {
            var res = await fetch('/api/link-tracking/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slug: slug, email: email })
            });
            var data = await res.json();
            if (!res.ok || data.ok === false) {
                throw new Error(data.error || data.reason || 'Échec');
            }
            return data;
        }

        async function loadContext() {
            if (!slug && !email) {
                showError('Lien invalide : identifiant manquant. Ouvrez ce lien depuis l\'email.');
                return;
            }

            if (autoConfirm || alreadyConfirmed) {
                showConfirmedPage(null, alreadyConfirmed);

                try {
                    var contextPromise = fetchContext().catch(function () {
                        return null;
                    });
                    var confirmPromise = alreadyConfirmed
                        ? Promise.resolve({ alreadyConfirmed: true })
                        : submitConfirmation();

                    var results = await Promise.all([contextPromise, confirmPromise]);
                    var data = results[0];
                    var confirmData = results[1];

                    if (data && data.cancelled) {
                        showError('Ce rendez-vous a déjà été annulé.');
                        return;
                    }

                    markConfirmedInUrl();
                    showConfirmedPage(
                        data,
                        Boolean(confirmData.alreadyConfirmed || alreadyConfirmed || (data && data.alreadyConfirmed))
                    );
                } catch (err) {
                    showError(err instanceof Error ? err.message : 'Impossible de confirmer.');
                }
                return;
            }

            try {
                var previewData = await fetchContext();
                if (previewData.cancelled) {
                    showError('Ce rendez-vous a déjà été annulé.');
                    return;
                }
                if (previewData.alreadyConfirmed) {
                    showConfirmedPage(previewData, true);
                    return;
                }
                renderContext(previewData);
                statusEl.textContent = '';
                statusEl.className = 'status';
            } catch (err) {
                showError(err instanceof Error ? err.message : 'Impossible de charger cette page.');
            }
        }

        void loadContext();
    </script>
</body>
</html>
