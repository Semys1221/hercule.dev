<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modalités d'Hercule · Confirmation</title>
    <link rel="icon" href="/icon-32x32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
    <style>
        :root {
            --background: #09090B;
            --foreground: #ffffff;
            --muted-foreground: #a1a1aa;
            --border: #27272a;
            --accent: #ffffff;
            --success: #22c55e;
            --error: #ef4444;
            --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 64px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .brand svg { width: 20px; height: 20px; }
        .brand span { font-size: 15px; font-weight: 600; }

        h1 {
            font-size: 28px;
            font-weight: 500;
            margin: 0 0 12px;
            letter-spacing: -0.02em;
        }

        .intro, .meeting, .formula-detail {
            color: var(--muted-foreground);
            font-size: 15px;
            margin: 0 0 16px;
        }

        .meeting { color: var(--foreground); font-weight: 500; }

        .formulas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 24px 0 32px;
        }

        .formula {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
        }

        .formula-name {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px;
        }

        .formula-detail { margin: 0; }

        .confirm-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            border: 0;
            border-radius: 10px;
            background: var(--foreground);
            color: var(--background);
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .confirm-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .warning {
            margin-top: 16px;
            font-size: 13px;
            color: var(--muted-foreground);
        }

        .status { margin-top: 12px; font-size: 15px; }
        .status.ok { color: var(--success); }
        .status.error { color: var(--error); }
        .status.pending { color: var(--muted-foreground); }

        .is-hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="page">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hercule">
                <path d="M3 5v14l7.5-7L3 5z" fill="#ffffff"/>
                <path d="M21 5v14l-7.5-7L21 5z" fill="#a1a1aa"/>
            </svg>
            <span>Hercule</span>
        </div>

        <h1>Modalités d'Hercule</h1>
        <p class="intro" id="intro">Chargement de votre rendez-vous…</p>
        <p class="meeting is-hidden" id="meeting"></p>
        <div class="formulas is-hidden" id="formulas"></div>
        <button class="confirm-btn is-hidden" type="button" id="confirmBtn">Confirmer le rendez-vous</button>
        <p class="warning is-hidden" id="warning">Attention : Sans confirmation avant votre rendez-vous, celui-ci sera automatiquement annulé une heure avant l'horaire prévu.</p>
        <p id="status" class="status pending" aria-live="polite"></p>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var pathMatch = window.location.pathname.match(/\/modalites-hercule\.html\/([^/]+)\/?$/);
        var slug = params.get('code') || params.get('slug') || (pathMatch ? pathMatch[1] : '') || '';
        var email = params.get('email') || '';
        var alreadyConfirmed = params.get('confirmed') === '1';

        var introEl = document.getElementById('intro');
        var meetingEl = document.getElementById('meeting');
        var formulasEl = document.getElementById('formulas');
        var confirmBtn = document.getElementById('confirmBtn');
        var warningEl = document.getElementById('warning');
        var statusEl = document.getElementById('status');

        function showSuccess(already) {
            introEl.textContent = '';
            meetingEl.classList.add('is-hidden');
            formulasEl.classList.add('is-hidden');
            confirmBtn.classList.add('is-hidden');
            warningEl.classList.add('is-hidden');
            statusEl.textContent = already
                ? 'Votre rendez-vous était déjà confirmé. Merci.'
                : 'Votre créneau a bien été confirmé. Merci.';
            statusEl.className = 'status ok';
        }

        function showError(message) {
            statusEl.textContent = message;
            statusEl.className = 'status error';
        }

        function markConfirmedInUrl() {
            var next = new URL(window.location.href);
            next.searchParams.set('confirmed', '1');
            if (slug && !next.searchParams.get('code') && !next.searchParams.get('slug')) {
                next.searchParams.set('code', slug);
            }
            window.history.replaceState({}, '', next.toString());
        }

        async function confirmPresence() {
            if (!slug && !email) {
                showError('Lien invalide : identifiant manquant. Ouvrez ce lien depuis l\'email.');
                return;
            }
            confirmBtn.disabled = true;
            statusEl.textContent = 'Confirmation en cours…';
            statusEl.className = 'status pending';
            try {
                var res = await fetch('/api/link-tracking/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug: slug, email: email })
                });
                var data = await res.json();
                if (!res.ok || data.ok === false) {
                    throw new Error(data.error || data.reason || 'Échec');
                }
                markConfirmedInUrl();
                showSuccess(Boolean(data.alreadyConfirmed));
            } catch (err) {
                confirmBtn.disabled = false;
                showError(err instanceof Error ? err.message : 'Impossible de confirmer.');
            }
        }

        async function loadContext() {
            if (!slug && !email) {
                introEl.textContent = '';
                showError('Lien invalide : identifiant manquant. Ouvrez ce lien depuis l\'email.');
                return;
            }
            if (alreadyConfirmed) {
                showSuccess(true);
                return;
            }
            try {
                var query = new URLSearchParams();
                if (slug) query.set('slug', slug);
                if (email) query.set('email', email);
                var res = await fetch('/api/modalites-campaign/context?' + query.toString());
                var data = await res.json();
                if (!res.ok || data.ok === false) {
                    throw new Error(data.error || data.reason || 'Lien introuvable');
                }
                if (data.cancelled) {
                    introEl.textContent = '';
                    showError('Ce rendez-vous a déjà été annulé.');
                    return;
                }
                if (data.alreadyConfirmed) {
                    showSuccess(true);
                    return;
                }
                introEl.textContent = data.intro || '';
                meetingEl.textContent = data.date && data.heure
                    ? 'Votre rendez-vous est prévu le ' + data.date + ' à ' + data.heure + ' (heure de Paris).'
                    : '';
                meetingEl.classList.remove('is-hidden');
                formulasEl.innerHTML = '';
                (data.formulas || []).forEach(function (formula) {
                    var card = document.createElement('div');
                    card.className = 'formula';
                    var name = document.createElement('p');
                    name.className = 'formula-name';
                    name.textContent = formula.name + (formula.recommended ? ' — recommandé' : '');
                    var detail = document.createElement('p');
                    detail.className = 'formula-detail';
                    detail.textContent = formula.detail;
                    card.appendChild(name);
                    card.appendChild(detail);
                    formulasEl.appendChild(card);
                });
                formulasEl.classList.remove('is-hidden');
                confirmBtn.textContent = data.buttonLabel || 'Confirmer le rendez-vous';
                confirmBtn.classList.remove('is-hidden');
                warningEl.classList.remove('is-hidden');
                statusEl.textContent = '';
            } catch (err) {
                introEl.textContent = '';
                showError(err instanceof Error ? err.message : 'Impossible de charger cette page.');
            }
        }

        confirmBtn.addEventListener('click', function () {
            void confirmPresence();
        });
        void loadContext();
    </script>
</body>
</html>
